services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: security-ops-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: security-ops-kibana

    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      SERVER_NAME: "security-ops-kibana"
      SERVER_HOST: "0.0.0.0"

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

volumes:
  elasticsearch-data: