rules:
  - id: AWS-SG-001
    name: SSH 포트 전체 인터넷 공개
    description: 보안그룹의 SSH 22번 포트가 0.0.0.0/0에 공개되었습니다.
    recommendation: 보안그룹의 SSH 허용 대상을 관리자 IP로 제한하세요.
    conditions:
      event.action: AuthorizeSecurityGroupIngress
      event.outcome: success
      source.cidr: 0.0.0.0/0
      destination.port: 22
    severity: 90
    severity_label: critical
    risk_score: 95
    tags:
      - critical
      - ssh_open_to_world
      - security_misconfiguration

  - id: WAF-SQLI-001
    name: AWS WAF SQL Injection 차단
    description: AWS WAF가 쿼리 문자열에서 SQL Injection 패턴을 탐지하고 요청을 차단했습니다.
    recommendation: 공격 IP의 반복 접근 여부와 ALB 및 Nginx 연관 로그를 확인하세요.
    conditions:
      log.source: aws_waf
      event.category: web
      event.action: block
      event.outcome: blocked
      rule.id: SQLi_QUERYARGUMENTS
    severity: 70
    severity_label: high
    risk_score: 85
    tags:
      - high
      - web_attack
      - sql_injection
      - blocked

  - id: ALB-ADMIN-001
    name: 관리자 페이지 접근 실패
    description: 외부 IP가 관리자 페이지에 접근했지만 인증에 실패했습니다.
    recommendation: 접속 IP의 이전 활동과 WAF 및 웹서버 연관 로그를 확인하세요.
    conditions:
      log.source: aws_alb
      event.category: web
      event.action: http_request
      event.outcome: failure
      url.path: /admin
      http.status_code: 401
    severity: 50
    severity_label: medium
    risk_score: 60
    tags:
      - medium
      - admin_access
      - unauthorized
      - authentication_failure